name: AirPods Pro 3 價格監控

on:
  schedule:
    # UTC 時間；每 15 分鐘一次，挑整點後幾分鐘，才抓得到「整點下殺」
    # GitHub 的排程常會延遲 5–20 分鐘，這是正常的
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch: {}          # 可以在 Actions 頁面手動按 Run workflow

permissions:
  contents: write                # 要把 ci_state.json commit 回 repo

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Taipei
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      STATE_FILE: ci_state.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 檢查價格
        run: python airpods_watch.py --once

      - name: 儲存狀態
        if: always()
        run: |
          [ -f ci_state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add ci_state.json
          git diff --cached --quiet && exit 0
          git commit -m "更新價格狀態"
          git push
