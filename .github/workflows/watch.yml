name: AirPods Pro 3 價格監控

on:
  schedule:
    - cron: "5,20,35,50 * * * *"   # UTC；每 15 分鐘，避開整點尖峰
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Taipei
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      STATE_FILE: ci_state.json
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main          # 永遠拿最新的價格紀錄，避免重複觸發時讀到舊狀態
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: 安裝套件
        run: pip install -r requirements.txt
      - name: 檢查價格
        run: python airpods_watch.py --once
      - name: 儲存狀態
        if: always()
        run: |
          [ -f ci_state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add ci_state.json
          git diff --cached --quiet && exit 0
          git commit -m "更新價格狀態"
          git push
